<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 200" width="100%" role="img">
<title>AI feature pipeline</title>
<desc>Query, embedding, vector search, language model, and grounded response pipeline.</desc>
<style>
:root { --bg: #0B0F14; --panel: #111827; --panel-2: #0F172A; --border: #1F2937; --accent-1: #34D399; --accent-2: #22D3EE; --accent-3: #A78BFA; --text: #E5E7EB; --muted: #94A3B8; --warn: #F59E0B; }
text { font-family: 'Segoe UI', Inter, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif; }
.mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
.packet { animation: travel 6s linear infinite; } @keyframes travel { from { offset-distance: 0%; } to { offset-distance: 100%; } }
</style>
<defs>
  <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#34D399"/><stop offset="100%" stop-color="#22D3EE"/></linearGradient>
  <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="12"/></filter>
</defs><rect width="880" height="200" rx="22" fill="#0B0F14" stroke="#1F2937"/><path id="flow" d="M84 100 H796" fill="none" stroke="#1F2937" stroke-width="3"/><circle class="packet" r="7" fill="#34D399"><animateMotion dur="6s" repeatCount="indefinite"><mpath href="#flow"/></animateMotion></circle><g><circle cx="84" cy="100" r="30" fill="#111827" fill-opacity=".25" stroke="#34D399" stroke-width="2"/><text x="84" y="96" text-anchor="middle" fill="#E5E7EB" font-size="16" font-weight="700">Query</text><text x="84" y="150" text-anchor="middle" fill="#94A3B8" font-size="13">user intent</text></g><g><circle cx="262" cy="100" r="30" fill="#111827" fill-opacity=".25" stroke="#34D399" stroke-width="2"/><text x="262" y="96" text-anchor="middle" fill="#E5E7EB" font-size="16" font-weight="700">Embed</text><text x="262" y="150" text-anchor="middle" fill="#94A3B8" font-size="13">Gemini / OpenAI</text></g><g><circle cx="440" cy="100" r="30" fill="#111827" fill-opacity=".25" stroke="#34D399" stroke-width="2"/><text x="440" y="96" text-anchor="middle" fill="#E5E7EB" font-size="16" font-weight="700">Vector Search</text><text x="440" y="150" text-anchor="middle" fill="#94A3B8" font-size="13">Pinecone / MongoDB</text></g><g><circle cx="618" cy="100" r="30" fill="#A78BFA" fill-opacity=".25" stroke="#A78BFA" stroke-width="2"/><text x="618" y="96" text-anchor="middle" fill="#E5E7EB" font-size="16" font-weight="700">LLM</text><text x="618" y="150" text-anchor="middle" fill="#94A3B8" font-size="13">Gemini / Groq</text></g><g><circle cx="796" cy="100" r="30" fill="#111827" fill-opacity=".25" stroke="#34D399" stroke-width="2"/><text x="796" y="96" text-anchor="middle" fill="#E5E7EB" font-size="16" font-weight="700">Response</text><text x="796" y="150" text-anchor="middle" fill="#94A3B8" font-size="13">grounded answer</text></g>
</svg>
